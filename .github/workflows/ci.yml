name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.preset }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gcc
            runner: ubuntu-latest
            tests: true

          - preset: linux-clang
            runner: ubuntu-latest
            tests: true

          - preset: linux-gcc
            runner: ubuntu-24.04-arm
            tests: true

          - preset: macos-clang
            runner: macos-latest
            tests: true

          - preset: windows-msvc
            runner: windows-latest
            tests: false # no gl on github's windows runners

          - preset: linux-clang-asan
            runner: ubuntu-latest
            tests: true

          - preset: linux-gcc-ci
            runner: ubuntu-latest
            tests: true

          - preset: linux-clang-ci
            runner: ubuntu-latest
            tests: true

          - preset: linux-gcc-demo
            runner: ubuntu-latest
            tests: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install windowing and software gl
        if: runner.os == 'Linux'
        run: |
            sudo apt-get update
            sudo apt-get install -y \
              libgl1-mesa-dri \
              libglu1-mesa-dev \
              libwayland-dev \
              libxkbcommon-dev \
              mesa-utils \
              wayland-protocols \
              xorg-dev \
              xvfb

      - name: configure
        run: cmake --preset ${{ matrix.preset }}

      - name: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: test (linux)
        if: matrix.tests && runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" ctest --preset ${{ matrix.preset }}

      - name: test
        if: matrix.tests && runner.os != 'Linux'
        run: ctest --preset ${{ matrix.preset }}

  emscripten:
    name: emscripten (wasm)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: report the toolchain
        run: emcc --version

      - name: configure
        run: emcmake cmake --preset emscripten

      - name: build
        run: cmake --build --preset emscripten

  android:
    name: android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: report the toolchain
        run: cat "$ANDROID_NDK_LATEST_HOME/source.properties"

      - name: configure
        run: cmake --preset android -DANDROID_ABI=${{ matrix.abi }}

      - name: build
        run: cmake --build --preset android

  ios:
    name: ios (simulator)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: configure
        run: cmake --preset ios-simulator

      - name: build
        run: cmake --build --preset ios-simulator

      - name: boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: test (simulator)
        continue-on-error: true
        run: ctest --preset ios-simulator

  docs:
    name: docs (doxygen)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            doxygen \
            graphviz \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols \
            xorg-dev

      - name: generate documentation
        run: cmake --preset linux-docs
